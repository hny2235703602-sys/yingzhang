[project]
name = "yingzhang-studio"
version = "0.1.0"
description = "映章 · 小说动漫分镜工作台"
requires-python = ">=3.11,<3.12"
dependencies = [
  "streamlit>=1.45,<2", "langgraph>=0.4,<2", "langgraph-checkpoint-sqlite>=2,<4",
  "pydantic>=2.10,<3", "pydantic-settings>=2.8,<3", "openai>=1.75,<3",
  "httpx>=0.28,<1", "sqlalchemy>=2.0,<3", "alembic>=1.15,<2"
]
[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11", "mypy>=1.15", "types-requests"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/novel_anime"]
[tool.ruff]
line-length = 100
target-version = "py311"
[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
ignore_missing_imports = true
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
